# StarLite Mk V touchscreen: Goodix HID multitouch on the ACPI-enumerated
# Intel Serial IO I2C2 controller.
CONFIG_HID_MULTITOUCH=y
CONFIG_I2C_HID_ACPI=y

# Alder Lake-N Serial IO plumbing used by ACPI-enumerated I2C peripherals.
CONFIG_X86_INTEL_LPSS=y
CONFIG_MFD_INTEL_LPSS_PCI=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_DESIGNWARE_PCI=y
CONFIG_PINCTRL_ALDERLAKE=y

# StarLite Mk V tablet orientation sensor. Firmware enumerates the display
# accelerometer as ACPI KIOX000A, which is handled by kxcjk-1013. Keep the
# complete path built in so orientation is available before Weston starts and
# does not depend on a late module load from the root filesystem.
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGER=y
CONFIG_IIO_TRIGGERED_BUFFER=y
CONFIG_KXCJK1013=y

# The StarLite Mk V uses an Intel PCIe wireless adapter. Keep the driver as a
# module so its firmware request occurs after the root filesystem is mounted.
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m

# The same Intel 9560 radio exposes Bluetooth over USB (8087:0aaa).
CONFIG_BT=y
CONFIG_BT_LE=y
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_INTEL=m
CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y
# CONFIG_BT_HCIBTUSB_BCM is not set
# CONFIG_BT_HCIBTUSB_RTL is not set

# Attached nRF USB CDC transport support; no peer daemon is installed yet.
CONFIG_USB_ACM=m
