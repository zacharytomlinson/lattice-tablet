[package]
name = "lattice-tablet-radio"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[dependencies]
lattice-vertex = { git = "ssh://git@github.com/zacharytomlinson/lattice-vertex.git", rev = "df71c62404509f3f527917d387838d482a83db7d", default-features = false, features = ["port-nrf52840", "host-link"] }
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["set-vtor", "set-sp"] }
embassy-usb = { version = "=0.5.1", default-features = false }
embassy-futures = "=0.1.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
